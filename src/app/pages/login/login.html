<main class="login sg-lamina">

  <!-- Marcas de registro en las esquinas de la lámina -->
  <span class="sg-marca sg-marca--si"></span>
  <span class="sg-marca sg-marca--sd"></span>
  <span class="sg-marca sg-marca--ii"></span>
  <span class="sg-marca sg-marca--id"></span>

  <!-- Lado izquierdo: dibujo arquitectónico -->
  <section class="login__dibujo" aria-hidden="true">
    <img
      class="login__casa"
      src="img/casa-login.png"
      alt=""
      width="800"
      height="720"
    >
  </section>

  <!-- Lado derecho: formulario -->
  <section class="login__panel">
    <div class="login__contenido">

      <header class="login__marca">
        <img
          class="login__logo"
          src="img/sigoa-logo.png"
          alt="SIGOA"
          width="240"
          height="62"
        >
        <p class="sg-label login__lema">
          Sistema Integral de Gestión de Obras y Arquitectura
        </p>
      </header>

      <h1 class="login__titulo">Iniciar sesión</h1>

      <form class="login__form" (ngSubmit)="iniciarSesion()">

        <div class="sg-campo">
          <label class="sg-label" for="correo">Correo</label>
          <div class="sg-campo__control">
            <input
              class="sg-input"
              type="email"
              id="correo"
              name="correo"
              [(ngModel)]="correo"
              autocomplete="email"
            >
          </div>
        </div>

        <div class="sg-campo">
          <label class="sg-label" for="password">Contraseña</label>
          <div class="sg-campo__control">
            <input
              class="sg-input"
              [type]="mostrarPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              autocomplete="current-password"
            >
            <button
              type="button"
              class="sg-input-icono"
              (click)="mostrarPassword = !mostrarPassword"
              [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (mostrarPassword) {
                <!-- Ícono: ojo tachado -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.7 5.1A10.9 10.9 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.7 2.7"/>
                  <path d="M6.6 6.6C3.9 8.4 2 12 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                  <path d="m2 2 20 20"/>
                </svg>
              } @else {
                <!-- Ícono: ojo -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
        </div>

        @if (mensaje) {
          <div class="sg-alerta" role="alert">{{ mensaje }}</div>
        }

        <button type="submit" class="sg-btn sg-btn--bloque" [disabled]="cargando">
          {{ cargando ? 'Entrando...' : 'Entrar' }}
        </button>

        <a class="login__olvido sg-mono" href="#" (click)="$event.preventDefault()">
          ¿Olvidaste tu contraseña?
        </a>
      </form>

      <footer class="login__pie sg-label">
        Soluciones Integrales Tecnológicas · v1.0
      </footer>

    </div>
  </section>

</main>
